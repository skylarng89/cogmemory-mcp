name: Publish

on:
  push:
    branches: [main]

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write # create tags
  id-token: write # npm trusted publisher (OIDC) + MCP Registry OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Determine version bump
        id: bump
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --format="%s" HEAD)
          else
            COMMITS=$(git log --format="%s" "${LAST_TAG}..HEAD")
          fi

          echo "Commits since last tag:"
          echo "$COMMITS"

          BUMP="none"
          if echo "$COMMITS" | grep -qiE '^[a-z]+(\(.+\))?!:|BREAKING CHANGE'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qiE '^feat(\(.+\))?:'; then
            BUMP="minor"
          elif echo "$COMMITS" | grep -qiE '^(fix|perf|refactor|revert|chore)(\(.+\))?:'; then
            BUMP="patch"
          fi

          echo "Detected bump: $BUMP"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

      - name: Bump version (local only — not committed)
        if: steps.bump.outputs.bump != 'none'
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "${{ steps.bump.outputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "Bumping $CURRENT → $NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          # Patch package.json — never committed, only used for build + publish
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf-8'));
            pkg.version = '$NEW_VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          # Patch server.json — never committed, only used for build + publish
          node -e "
            const fs = require('fs');
            const srv = JSON.parse(fs.readFileSync('server.json', 'utf-8'));
            srv.version = '$NEW_VERSION';
            srv.packages[0].version = '$NEW_VERSION';
            fs.writeFileSync('server.json', JSON.stringify(srv, null, 2) + '\n');
          "

      - name: Build
        if: steps.bump.outputs.bump != 'none'
        run: pnpm run build

      - name: Smoke test
        if: steps.bump.outputs.bump != 'none'
        run: pnpm run smoke-test

      - name: Create tag
        if: steps.bump.outputs.bump != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Publish to npm (Trusted Publisher)
        if: steps.bump.outputs.bump != 'none'
        run: npm publish --provenance --access public

      - name: Install mcp-publisher
        if: steps.bump.outputs.bump != 'none'
        run: |
          curl --proto "=https" --tlsv1.2 -sSf -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (OIDC)
        if: steps.bump.outputs.bump != 'none'
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        if: steps.bump.outputs.bump != 'none'
        run: ./mcp-publisher publish
